  /api/v1/health/live:
    get:
      summary: Liveness check
      description: Returns operational status of desktop engine and database subsystem.
        Cites [API-009].
      operationId: getLiveness
      tags:
      - System
      responses:
        '200':
          description: System is live
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - timestamp
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
components:
  securitySchemes:
    LocalRoleAuth:
      type: apiKey
      in: header
      name: X-Client-Role
      description: Active local user role header verified by local middleware.
  schemas:
    ProblemDetails:
      type: object
      description: Standard RFC 9457 Problem Details error format
      required:
      - type
      - title
      - status
      - detail
      properties:
        type:
          type: string
          format: uri
          example: https://autonoma.local/errors/validation
        title:
          type: string
          example: Validation Error
        status:
          type: integer
          example: 422
        detail:
          type: string
          example: Required input field is missing or invalid.
        instance:
          type: string
          example: /api/v1/resource/req-102
    AllowUsersToSearchDocumentsBCreateRequest:
      type: object
      required:
      - title
      - category
      - parameters
      properties:
        title:
          type: string
          example: Sample for Allow users to search documents by tags
        category:
          type: string
          example: Standard
        parameters:
          type: object
          description: Structured operational parameters
    AllowUsersToSearchDocumentsBRecord:
      type: object
      required:
      - id
      - title
      - status
      - created_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
          example: active
        parameters:
          type: object
        created_at:
          type: string
          format: date-time
    AllowUsersToSearchDocumentsBListResponse:
      type: object
      required:
      - items
      - total_count
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AllowUsersToSearchDocumentsBRecord'
        total_count:
          type: integer
    EnableUsersToOrganizeSnippetCreateRequest:
      type: object
      required:
      - title
      - category
      - parameters
      properties:
        title:
          type: string
          example: Sample for Enable users to organize snippets in a smart snippet
            organizer
        category:
          type: string
          example: Standard
        parameters:
          type: object
          description: Structured operational parameters
    EnableUsersToOrganizeSnippetRecord:
      type: object
      required:
      - id
      - title
      - status
      - created_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
          example: active
        parameters:
          type: object
        created_at:
          type: string
          format: date-time
    EnableUsersToOrganizeSnippetListResponse:
      type: object
      required:
      - items
      - total_count
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EnableUsersToOrganizeSnippetRecord'
        total_count:
          type: integer
    SupportLocalCitationExportCreateRequest:
      type: object
      required:
      - title
      - category
      - parameters
      properties:
        title:
          type: string
          example: Sample for Support local citation export
        category:
          type: string
          example: Standard
        parameters:
          type: object
          description: Structured operational parameters
    SupportLocalCitationExportRecord:
