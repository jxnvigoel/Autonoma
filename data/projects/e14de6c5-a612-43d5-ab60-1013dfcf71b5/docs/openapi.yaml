openapi: 3.0.3
info:
  title: DocuPulse Reader Local REST API
  version: 1.0.0
  description: Internal API contract for DocuPulse Reader workflows. Single source
    of truth for frontend and backend components.
  contact:
    name: Solution Architecture Team
servers:
- url: http://127.0.0.1:8765
  description: Local desktop application loopback server
paths:
  /api/v1/allow-users-search:
    post:
      summary: Create record for Allow users to search documents by tags
      description: Execution and ingestion endpoint supporting Allow users to search
        documents by tags [F-001]. Cites [API-001].
      operationId: create_allow-users-search_1
      tags:
      - F-001
      - allow-users-search
      security:
      - LocalRoleAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllowUsersToSearchDocumentsBCreateRequest'
      responses:
        '201':
          description: Allow users to search documents by tags record saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllowUsersToSearchDocumentsBRecord'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '422':
          $ref: '#/components/responses/422ValidationError'
        '500':
          $ref: '#/components/responses/500InternalError'
    get:
      summary: Query records for Allow users to search documents by tags
      description: Query and filter records supporting Allow users to search documents
        by tags [F-001]. Cites [API-001].
      operationId: list_allow-users-search_1
      tags:
      - F-001
      - allow-users-search
      security:
      - LocalRoleAuth: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          maximum: 500
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: List of Allow users to search documents by tags records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllowUsersToSearchDocumentsBListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '500':
          $ref: '#/components/responses/500InternalError'
  /api/v1/allow-users-search/process:
    post:
      summary: Process operations for Allow users to search documents by tags
