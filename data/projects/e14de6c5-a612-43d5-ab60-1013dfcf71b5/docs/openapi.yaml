  responses:
    400BadRequest:
      description: Invalid input syntax or missing required parameters (RFC 9457)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    401Unauthorized:
      description: Missing or unauthenticated user session context (RFC 9457)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    403Forbidden:
      description: Active persona role lacks permission to execute requested operation
        (RFC 9457)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    409Conflict:
      description: State conflict or concurrency lock on target record (RFC 9457)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    422ValidationError:
      description: Semantic validation failure on request payload (RFC 9457)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    500InternalError:
      description: Unexpected internal application or database error (RFC 9457)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
