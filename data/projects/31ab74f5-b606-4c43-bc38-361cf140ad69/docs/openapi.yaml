openapi: 3.0.3
info:
  title: DocuPulse Reader Local REST API
  version: 1.0.0
  description: Internal API contract for DocuPulse Reader workflows. Single source
    of truth for frontend and backend components.
  contact:
    name: Solution Architecture Team
servers:
- url: http://127.0.0.1:8765
  description: Local desktop application loopback server
paths:
  /api/v1/document-reader:
    post:
      summary: Create record for Local document reader with smart highlight snippet
        tagging
      description: Execution and ingestion endpoint supporting Local document reader
        with smart highlight snippet tagging [F-001]. Cites [API-001].
      operationId: create_document-reader_1
      tags:
      - F-001
      - document-reader
      security:
      - LocalRoleAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocalDocumentReaderWithSmartCreateRequest'
      responses:
        '201':
          description: Local document reader with smart highlight snippet tagging
            record saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalDocumentReaderWithSmartRecord'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '422':
          $ref: '#/components/responses/422ValidationError'
        '500':
          $ref: '#/components/responses/500InternalError'
    get:
      summary: Query records for Local document reader with smart highlight snippet
        tagging
      description: Query and filter records supporting Local document reader with
        smart highlight snippet tagging [F-001]. Cites [API-001].
      operationId: list_document-reader_1
      tags:
      - F-001
      - document-reader
      security:
      - LocalRoleAuth: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          maximum: 500
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: List of Local document reader with smart highlight snippet
            tagging records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalDocumentReaderWithSmartListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '500':
          $ref: '#/components/responses/500InternalError'
  /api/v1/document-reader/process:
    post:
      summary: Process operations for Local document reader with smart highlight snippet
        tagging
      description: Specific transaction execution supporting Local document reader
        with smart highlight snippet tagging [F-001]. Cites [API-003].
      operationId: process_document-reader_1
      tags:
      - F-001
      - document-reader
      security:
      - LocalRoleAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - action
              properties:
                action:
                  type: string
      responses:
        '200':
          description: Operation processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalDocumentReaderWithSmartRecord'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '500':
          $ref: '#/components/responses/500InternalError'
  /api/v1/citations:
    post:
      summary: Create record for One-click local bibliography citation export in BibTeX
        and Markdown formats
      description: Execution and ingestion endpoint supporting One-click local bibliography
        citation export in BibTeX and Markdown formats [F-002]. Cites [API-002].
      operationId: create_citations_2
      tags:
      - F-002
      - citations
      security:
      - LocalRoleAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OneClickLocalBibliographyCitCreateRequest'
      responses:
        '201':
          description: One-click local bibliography citation export in BibTeX and
            Markdown formats record saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OneClickLocalBibliographyCitRecord'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '422':
          $ref: '#/components/responses/422ValidationError'
        '500':
          $ref: '#/components/responses/500InternalError'
    get:
      summary: Query records for One-click local bibliography citation export in BibTeX
        and Markdown formats
      description: Query and filter records supporting One-click local bibliography
        citation export in BibTeX and Markdown formats [F-002]. Cites [API-002].
      operationId: list_citations_2
      tags:
      - F-002
      - citations
      security:
      - LocalRoleAuth: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          maximum: 500
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: List of One-click local bibliography citation export in BibTeX
            and Markdown formats records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OneClickLocalBibliographyCitListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '500':
          $ref: '#/components/responses/500InternalError'
  /api/v1/citations/export:
    post:
      summary: Process operations for One-click local bibliography citation export
        in BibTeX and Markdown formats
      description: Specific transaction execution supporting One-click local bibliography
        citation export in BibTeX and Markdown formats [F-002]. Cites [API-004].
      operationId: process_citations_2
      tags:
      - F-002
      - citations
      security:
      - LocalRoleAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - action
              properties:
                action:
                  type: string
      responses:
        '200':
          description: Operation processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OneClickLocalBibliographyCitRecord'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '500':
          $ref: '#/components/responses/500InternalError'
  /api/v1/health/live:
    get:
      summary: Liveness check
      description: Returns operational status of desktop engine and database subsystem.
        Cites [API-005].
      operationId: getLiveness
      tags:
      - System
      responses:
        '200':
          description: System is live
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - timestamp
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
components:
  securitySchemes:
    LocalRoleAuth:
      type: apiKey
      in: header
      name: X-Client-Role
      description: Active local user role header verified by local middleware.
  schemas:
    ProblemDetails:
      type: object
      description: Standard RFC 9457 Problem Details error format
      required:
      - type
      - title
      - status
      - detail
      properties:
        type:
          type: string
          format: uri
          example: https://autonoma.local/errors/validation
        title:
          type: string
          example: Validation Error
        status:
          type: integer
          example: 422
        detail:
          type: string
          example: Required input field is missing or invalid.
        instance:
          type: string
          example: /api/v1/resource/req-102
    LocalDocumentReaderWithSmartCreateRequest:
      type: object
      required:
      - title
      - category
      - parameters
      properties:
        title:
          type: string
          example: Sample for Local document reader with smart highlight snippet tagging
        category:
          type: string
          example: Standard
        parameters:
          type: object
          description: Structured operational parameters
    LocalDocumentReaderWithSmartRecord:
      type: object
      required:
      - id
      - title
      - status
      - created_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
          example: active
        parameters:
          type: object
        created_at:
          type: string
          format: date-time
    LocalDocumentReaderWithSmartListResponse:
      type: object
      required:
      - items
      - total_count
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LocalDocumentReaderWithSmartRecord'
        total_count:
          type: integer
    OneClickLocalBibliographyCitCreateRequest:
      type: object
      required:
      - title
      - category
      - parameters
      properties:
        title:
          type: string
          example: Sample for One-click local bibliography citation export in BibTeX
            and Markdown formats
        category:
          type: string
          example: Standard
        parameters:
          type: object
          description: Structured operational parameters
    OneClickLocalBibliographyCitRecord:
      type: object
      required:
      - id
      - title
      - status
      - created_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
          example: active
        parameters:
          type: object
        created_at:
          type: string
          format: date-time
    OneClickLocalBibliographyCitListResponse:
      type: object
      required:
      - items
      - total_count
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OneClickLocalBibliographyCitRecord'
        total_count:
          type: integer
  responses:
    400BadRequest:
      description: Invalid input syntax or missing required parameters (RFC 9457)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    401Unauthorized:
      description: Missing or unauthenticated user session context (RFC 9457)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    403Forbidden:
      description: Active persona role lacks permission to execute requested operation
        (RFC 9457)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    409Conflict:
      description: State conflict or concurrency lock on target record (RFC 9457)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    422ValidationError:
      description: Semantic validation failure on request payload (RFC 9457)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    500InternalError:
      description: Unexpected internal application or database error (RFC 9457)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
