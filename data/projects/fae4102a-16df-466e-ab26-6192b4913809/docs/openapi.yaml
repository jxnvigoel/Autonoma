      operationId: create_cold_storage_temperature_2
      tags:
      - F-002
      - cold_storage_temperature
      security:
      - LocalRoleAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ColdStorageTemperatureExcursCreateRequest'
      responses:
        '201':
          description: Cold-storage temperature excursion logging processed and stored
            successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColdStorageTemperatureExcursRecord'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '422':
          $ref: '#/components/responses/422ValidationError'
        '500':
          $ref: '#/components/responses/500InternalError'
    get:
      summary: List and query records for Cold-storage temperature excursion logging
      description: Query and filter records supporting Cold-storage temperature excursion
        logging [F-002] with latency < 1.0 s [NFR-01]. Cites [API-002].
      operationId: list_cold_storage_temperature_2
      tags:
      - F-002
      - cold_storage_temperature
      security:
      - LocalRoleAuth: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          maximum: 500
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: List of Cold-storage temperature excursion logging records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColdStorageTemperatureExcursListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '500':
          $ref: '#/components/responses/500InternalError'
  /api/v1/custodial-transfer-sign-:
    post:
      summary: Create and execute Custodial transfer sign-off with digital confirmation
      description: Execution and record ingestion endpoint supporting Custodial transfer
        sign-off with digital confirmation [F-003]. Cites [API-003].
      operationId: create_custodial_transfer_sign__3
      tags:
      - F-003
      - custodial_transfer_sign_
      security:
      - LocalRoleAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustodialTransferSignOffWithCreateRequest'
      responses:
        '201':
          description: Custodial transfer sign-off with digital confirmation processed
            and stored successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustodialTransferSignOffWithRecord'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '422':
          $ref: '#/components/responses/422ValidationError'
        '500':
          $ref: '#/components/responses/500InternalError'
    get:
      summary: List and query records for Custodial transfer sign-off with digital
        confirmation
      description: Query and filter records supporting Custodial transfer sign-off
        with digital confirmation [F-003] with latency < 1.0 s [NFR-01]. Cites [API-003].
      operationId: list_custodial_transfer_sign__3
      tags:
      - F-003
      - custodial_transfer_sign_
      security:
      - LocalRoleAuth: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          maximum: 500
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: List of Custodial transfer sign-off with digital confirmation
            records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustodialTransferSignOffWithListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '500':
          $ref: '#/components/responses/500InternalError'
  /api/v1/pdf-csv-regulatory-inspe:
    post:
      summary: Create and execute PDF/CSV regulatory inspection audit export
      description: Execution and record ingestion endpoint supporting PDF/CSV regulatory
        inspection audit export [F-004]. Cites [API-004].
      operationId: create_pdf_csv_regulatory_inspe_4
      tags:
      - F-004
      - pdf_csv_regulatory_inspe
      security:
      - LocalRoleAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PdfCsvRegulatoryInspectionAuCreateRequest'
      responses:
        '201':
          description: PDF/CSV regulatory inspection audit export processed and stored
            successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PdfCsvRegulatoryInspectionAuRecord'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '422':
          $ref: '#/components/responses/422ValidationError'
        '500':
          $ref: '#/components/responses/500InternalError'
    get:
      summary: List and query records for PDF/CSV regulatory inspection audit export
      description: Query and filter records supporting PDF/CSV regulatory inspection
        audit export [F-004] with latency < 1.0 s [NFR-01]. Cites [API-004].
      operationId: list_pdf_csv_regulatory_inspe_4
      tags:
      - F-004
      - pdf_csv_regulatory_inspe
      security:
      - LocalRoleAuth: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          maximum: 500
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: List of PDF/CSV regulatory inspection audit export records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PdfCsvRegulatoryInspectionAuListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '500':
          $ref: '#/components/responses/500InternalError'
  /api/v1/health/live:
    get:
      summary: Liveness check
      description: Returns operational status of desktop engine and database subsystem.
        Cites [API-005].
      operationId: getLiveness
      tags:
      - System
      responses:
        '200':
          description: System is live
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - timestamp
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
components:
  securitySchemes:
    LocalRoleAuth:
      type: apiKey
      in: header
      name: X-Client-Role
      description: Active local user role header verified by local middleware.
  schemas:
    ProblemDetails:
      type: object
      description: Standard RFC 9457 Problem Details error format
      required:
      - type
      - title
      - status
      - detail
      properties:
        type:
          type: string
          format: uri
          example: https://autonoma.local/errors/validation
        title:
          type: string
          example: Validation Error
        status:
          type: integer
          example: 422
        detail:
          type: string
          example: Required input field is missing or invalid.
        instance:
          type: string
          example: /api/v1/resource/req-102
    SpecimenCheckInWith2dBarcodeCreateRequest:
      type: object
      required:
      - name
      - details
      properties:
        name:
          type: string
          example: Sample for Specimen check-in with 2D barcode generation
        status:
          type: string
          enum:
          - active
          - pending
          - completed
          default: active
        details:
          type: string
          example: Operational parameters for Specimen check-in with 2D barcode generation.
    SpecimenCheckInWith2dBarcodeRecord:
      type: object
      required:
      - id
      - name
      - status
      - created_at
      properties:
        id:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        name:
          type: string
          example: Sample for Specimen check-in with 2D barcode generation
        status:
          type: string
          example: active
        details:
          type: string
        created_at:
          type: string
          format: date-time
    SpecimenCheckInWith2dBarcodeListResponse:
      type: object
      required:
      - items
      - total_count
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SpecimenCheckInWith2dBarcodeRecord'
        total_count:
          type: integer
          example: 12
    ColdStorageTemperatureExcursCreateRequest:
      type: object
      required:
      - name
      - details
      properties:
        name:
          type: string
          example: Sample for Cold-storage temperature excursion logging
        status:
          type: string
          enum:
          - active
          - pending
          - completed
          default: active
        details:
          type: string
          example: Operational parameters for Cold-storage temperature excursion logging.
    ColdStorageTemperatureExcursRecord:
      type: object
      required:
      - id
      - name
      - status
      - created_at
      properties:
        id:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        name:
          type: string
          example: Sample for Cold-storage temperature excursion logging
        status:
          type: string
          example: active
        details:
          type: string
        created_at:
          type: string
          format: date-time
    ColdStorageTemperatureExcursListResponse:
      type: object
      required:
      - items
      - total_count
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ColdStorageTemperatureExcursRecord'
        total_count:
          type: integer
          example: 12
    CustodialTransferSignOffWithCreateRequest:
      type: object
      required:
      - name
      - details
      properties:
        name:
          type: string
          example: Sample for Custodial transfer sign-off with digital confirmation
        status:
          type: string
          enum:
          - active
          - pending
          - completed
          default: active
        details:
          type: string
          example: Operational parameters for Custodial transfer sign-off with digital
            confirmation.
    CustodialTransferSignOffWithRecord:
      type: object
      required:
      - id
      - name
      - status
      - created_at
      properties:
        id:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        name:
          type: string
          example: Sample for Custodial transfer sign-off with digital confirmation
        status:
          type: string
          example: active
        details:
          type: string
        created_at:
          type: string
          format: date-time
    CustodialTransferSignOffWithListResponse:
      type: object
      required:
      - items
      - total_count
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CustodialTransferSignOffWithRecord'
        total_count:
          type: integer
          example: 12
    PdfCsvRegulatoryInspectionAuCreateRequest:
      type: object
      required:
      - name
      - details
      properties:
        name:
          type: string
          example: Sample for PDF/CSV regulatory inspection audit export
        status:
          type: string
          enum:
          - active
          - pending
          - completed
          default: active
        details:
          type: string
          example: Operational parameters for PDF/CSV regulatory inspection audit
            export.
    PdfCsvRegulatoryInspectionAuRecord:
      type: object
      required:
      - id
      - name
      - status
      - created_at
      properties:
        id:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        name:
          type: string
          example: Sample for PDF/CSV regulatory inspection audit export
        status:
          type: string
          example: active
        details:
          type: string
        created_at:
          type: string
          format: date-time
    PdfCsvRegulatoryInspectionAuListResponse:
      type: object
      required:
      - items
      - total_count
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PdfCsvRegulatoryInspectionAuRecord'
        total_count:
          type: integer
          example: 12
  responses:
    400BadRequest:
      description: Invalid input syntax or missing required parameters (RFC 9457)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    401Unauthorized:
      description: Missing or unauthenticated user session context (RFC 9457)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    403Forbidden:
      description: Active persona role lacks permission to execute requested operation
        (RFC 9457)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    409Conflict:
      description: State conflict or concurrency lock on target record (RFC 9457)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    422ValidationError:
      description: Semantic validation failure on request payload (RFC 9457)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    500InternalError:
      description: Unexpected internal application or database error (RFC 9457)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
