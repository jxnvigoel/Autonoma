openapi: 3.0.3
info:
  title: BioVault Lab Local REST API
  version: 1.0.0
  description: Internal API contract for BioVault Lab local desktop inspection and
    export workflows. Single source of truth for frontend and backend components.
  contact:
    name: Solution Architecture Team
servers:
- url: http://127.0.0.1:8765
  description: Local desktop application loopback server
paths:
  /api/v1/specimen-check-in-with-2:
    post:
      summary: Create and execute Specimen check-in with 2D barcode generation
      description: Execution and record ingestion endpoint supporting Specimen check-in
        with 2D barcode generation [F-001]. Cites [API-001].
      operationId: create_specimen_check_in_with_2_1
      tags:
      - F-001
      - specimen_check_in_with_2
      security:
      - LocalRoleAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpecimenCheckInWith2dBarcodeCreateRequest'
      responses:
        '201':
          description: Specimen check-in with 2D barcode generation processed and
            stored successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecimenCheckInWith2dBarcodeRecord'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '422':
          $ref: '#/components/responses/422ValidationError'
        '500':
          $ref: '#/components/responses/500InternalError'
    get:
      summary: List and query records for Specimen check-in with 2D barcode generation
      description: Query and filter records supporting Specimen check-in with 2D barcode
        generation [F-001] with latency < 1.0 s [NFR-01]. Cites [API-001].
      operationId: list_specimen_check_in_with_2_1
      tags:
      - F-001
      - specimen_check_in_with_2
      security:
      - LocalRoleAuth: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          maximum: 500
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: List of Specimen check-in with 2D barcode generation records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecimenCheckInWith2dBarcodeListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '500':
          $ref: '#/components/responses/500InternalError'
  /api/v1/cold-storage-temperature:
    post:
      summary: Create and execute Cold-storage temperature excursion logging
